version: '3.8'

services:
  kumo:
    image: ghcr.io/sivchari/kumo:latest
    ports:
      - "4566:4566"    # S3 API
      - "4567:4567"    # Health check
    environment:
      - KUMO_HOST=0.0.0.0
      - KUMO_PORT=4566
      - KUMO_LOG_LEVEL=info
    networks:
      - act_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4567/health"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  act_network:
    driver: bridge