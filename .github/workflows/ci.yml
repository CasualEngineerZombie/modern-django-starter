name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q

  integration:
    name: Integration (generated-project E2E matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Run generated-project E2E tests
        env:
          RUN_DJANGO_INTEGRATION_TESTS: "1"
        run: |
          uv run pytest -q \
            tests/test_api_only_integration.py \
            tests/test_storage_dependencies.py \
            tests/test_stripe_webhook_secret.py \
            tests/test_generated_projects_e2e.py

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Build package
        run: uv build

      - name: Validate package
        run: uvx twine check dist/*

      - name: Verify template data is packaged
        run: |
          python -c '
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          templates = [n for n in names if n.startswith("modern_django_starter/templates/")]
          assert templates, "templates package-data missing from wheel"
          print(len(templates), "template files packaged in wheel")
          '