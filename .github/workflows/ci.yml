name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Run pytest
        env:
          PYTHONWARNINGS: "error::SyntaxWarning,error::DeprecationWarning"
        run: uv run pytest -q

  integration:
    name: Integration (generated-project E2E matrix)
    runs-on: ubuntu-latest
    services:
      kumo:
        image: ghcr.io/sivchari/kumo:latest
        env:
          KUMO_HOST: 0.0.0.0
          KUMO_PORT: 4566
          KUMO_LOG_LEVEL: info
        ports:
          - 4566:4566
        # Explicit ports mapping required for GitHub-hosted runners to reach
        # the service container on localhost:4566. act runs use the compose
        # kumo from docker-compose.act.yml which also maps 4566:4566.
        # No healthcheck options: act does not wait for service health, so the
        # tests poll the emulator themselves instead.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Run generated-project E2E tests
        env:
          RUN_DJANGO_INTEGRATION_TESTS: "1"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_STORAGE_BUCKET_NAME: test-bucket
        run: |
          # GitHub-hosted runners reach the kumo service container on the
          # mapped localhost port; act runs (ci-local.sh) override it via
          # .act.env if their endpoint differs, so keep the default
          # overridable.
          export AWS_S3_ENDPOINT_URL="${AWS_S3_ENDPOINT_URL:-http://localhost:4566}"
          # --no-cov: these E2E tests exercise the generated projects, not the
          # generator package, so the 70% coverage gate (meant for the unit
          # suite) would fail on ~1% coverage of the package sources.
          uv run pytest -q --no-cov \
            tests/test_api_only_integration.py \
            tests/test_storage_dependencies.py \
            tests/test_stripe_webhook_secret.py \
            tests/test_generated_projects_e2e.py \
            tests/test_aws_s3_integration.py

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Build package
        run: uv build

      - name: Validate package
        run: uvx twine check dist/*

      - name: Verify template data is packaged
        run: |
          python -c '
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          templates = [n for n in names if n.startswith("modern_django_starter/templates/")]
          assert templates, "templates package-data missing from wheel"
          print(len(templates), "template files packaged in wheel")
          '